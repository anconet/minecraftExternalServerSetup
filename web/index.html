<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnconaLabs Minecraft Server</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-1: #06111f;
            --bg-2: #0f1f33;
            --card: rgba(12, 19, 31, 0.78);
            --border: rgba(148, 163, 184, 0.2);
            --text: #eef4ff;
            --muted: #b4c0d3;
            --accent: #67e8f9;
            --accent-strong: #22d3ee;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(103, 232, 249, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.12), transparent 26%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2));
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(720px, 100%);
            padding: 40px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: var(--card);
            backdrop-filter: blur(18px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2.2rem, 4vw, 4rem);
            line-height: 1.02;
            letter-spacing: -0.04em;
        }

        p {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 1.08rem;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 22px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            color: #02131f;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            box-shadow: 0 12px 30px rgba(34, 211, 238, 0.25);
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(34, 211, 238, 0.34);
        }

        .note {
            font-size: 0.95rem;
            color: #9fb0c7;
        }

        code {
            padding: 0.16rem 0.36rem;
            border-radius: 0.4rem;
            background: rgba(148, 163, 184, 0.14);
            color: #e0f9ff;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>welcome to anconalabs minecraft server!</h1>
        <p>
            Download the Windows connector below, then run it to start a local
            tunnel to <code>mc.anconalabs.com</code> on <code>localhost:25565</code>.
        </p>
        <div class="actions">
            <a class="button" href="/downloads/cloudflared-connect.bat" download>
                Download Windows connector
            </a>
        </div>
        <p class="note">
            If you already have cloudflared installed, you can run the BAT file or
            use your own tunnel command.
        </p>
    </main>
</body>

</html>
