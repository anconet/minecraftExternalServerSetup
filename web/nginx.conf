server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /downloads/cloudflared-connect.bat {
        alias /usr/share/nginx/html/downloads/cloudflared-connect.bat;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="cloudflared-connect.bat"' always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}